<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Varun N — payments engineer">
  <defs>
    <!-- the dot field -->
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="2.6" fill="#ffffff"/>
    </pattern>
    <mask id="dotMask">
      <rect width="1200" height="200" fill="url(#dots)"/>
    </mask>

    <!-- base dim field so the grid is always visible -->
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2b3a"/>
      <stop offset="100%" stop-color="#141d28"/>
    </linearGradient>

    <!-- the travelling light: teal -> violet -> magenta -->
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0.00" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="0.38" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="0.58" stop-color="#e879f9" stop-opacity="0.95"/>
      <stop offset="0.78" stop-color="#f472b6" stop-opacity="0.55"/>
      <stop offset="1.00" stop-color="#f472b6" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1.1 0; 1.1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- soft vertical falloff so the band has depth -->
    <linearGradient id="falloff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.30"/>
    </linearGradient>
    <mask id="falloffMask">
      <rect width="1200" height="200" fill="url(#falloff)"/>
    </mask>
  </defs>

  <rect width="1200" height="200" rx="14" fill="#0d1117"/>

  <!-- dim dot field -->
  <g mask="url(#dotMask)">
    <rect width="1200" height="200" fill="url(#base)"/>
  </g>

  <!-- the light sweeping across the dots -->
  <g mask="url(#dotMask)">
    <g mask="url(#falloffMask)">
      <rect width="1200" height="200" fill="url(#wave)"/>
    </g>
  </g>

  <!-- a few dots that breathe independently, so it never looks like a single loop -->
  <g fill="#67e8f9">
    <circle cx="153" cy="63" r="3.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="459" cy="135" r="3.4"><animate attributeName="opacity" values="1;0.2;1" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="783" cy="45" r="3.4"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="1017" cy="153" r="3.4"><animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="639" cy="99" r="3.4"><animate attributeName="opacity" values="0.25;1;0.25" dur="6.1s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="199" rx="14" fill="none" stroke="#30363d"/>
</svg>
